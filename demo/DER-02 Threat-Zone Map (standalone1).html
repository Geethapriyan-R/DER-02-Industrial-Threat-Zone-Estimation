document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\n      <button class=\"si\" type=\"button\" data-base=\"sat\" aria-pressed=\"true\">Satellite<\u002Fbutton>\n      <button class=\"si\" type=\"button\" data-base=\"street\" aria-pressed=\"false\">Dark canvas<\u002Fbutton>\n      <div class=\"sh\">Actions<\u002Fdiv>\n      <button class=\"si\" type=\"button\" id=\"recenter\">Recenter epicenter<\u002Fbutton>\n      <button class=\"si\" type=\"button\" id=\"si-compare\" aria-pressed=\"false\">Compare configs<\u002Fbutton>\n      <button class=\"si\" type=\"button\" id=\"fit\">Fit to zones<\u002Fbutton>\n      <button class=\"si\" type=\"button\" id=\"reset\">Reset parameters<\u002Fbutton>\n      <button class=\"si\" type=\"button\" id=\"help2\">Keyboard shortcuts<\u002Fbutton>\n    <\u002Fnav>\n  <\u002Faside>\n\n  <div class=\"body\">\n    <div class=\"tbar\">DER-02 — Threat-Zone Estimation<\u002Fdiv>\n    <div class=\"main\">\n\n      <div style=\"display:flex; align-items:flex-start; gap:10px;\">\n        <div>\n          <div style=\"font-size:22px; font-weight:700; letter-spacing:-.02em;\">Threat-zone estimation<\u002Fdiv>\n          <div style=\"font-size:12px; color:var(--sub); margin-top:1px;\" id=\"subhead\"><\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"pill\" style=\"background:rgba(48,209,88,.18); color:#5be07f; margin-top:4px;\">\n          <span style=\"width:7px;height:7px;border-radius:999px;background:#34c759;animation:pulse 1.6s infinite\"><\u002Fspan>Active sim\n        <\u002Fspan>\n        <div style=\"margin-left:auto; display:flex; gap:8px;\">\n          <div class=\"seg\" id=\"units\">\n            <button type=\"button\" data-unit=\"m\" aria-pressed=\"true\">m<\u002Fbutton>\n            <button type=\"button\" data-unit=\"ft\" aria-pressed=\"false\">ft<\u002Fbutton>\n          <\u002Fdiv>\n          <button class=\"btn\" type=\"button\" id=\"compare\" aria-pressed=\"false\">Compare configs<\u002Fbutton>\n          <button class=\"btn\" type=\"button\" id=\"copylink\">Copy link<\u002Fbutton>\n          <button class=\"btn\" type=\"button\" id=\"export\">Export GeoJSON<\u002Fbutton>\n          <button class=\"btn\" type=\"button\" id=\"help\" aria-label=\"Keyboard shortcuts\">?<\u002Fbutton>\n          <button class=\"btn p\" type=\"button\" onclick=\"window.print()\">Print report<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\" id=\"leak-banner\" style=\"display:none; border-color:var(--red); background:rgba(255,69,58,.12); padding:12px 14px; align-items:center;\">\n        <div style=\"display:flex; align-items:center; gap:10px;\">\n          <span style=\"width:9px;height:9px;border-radius:999px;background:var(--red);animation:pulse 1s infinite\"><\u002Fspan>\n          <span style=\"font-size:13px; font-weight:700; letter-spacing:.01em; color:#ff8078;\">LEAK DETECTED — HAZARD ZONE AUTO-CALCULATED<\u002Fspan>\n          <span style=\"margin-left:auto; font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums;\" id=\"leak-time\"><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <div class=\"ch\">\n          Live Sensor Feed\n          <span class=\"pill\" id=\"sensor-pill\" style=\"background:rgba(48,209,88,.18); color:#5be07f;\">Nominal<\u002Fspan>\n          <div style=\"margin-left:auto; display:flex; gap:8px;\">\n            <button class=\"btn\" type=\"button\" id=\"btn-leak\">Simulate Leak<\u002Fbutton>\n            <button class=\"btn\" type=\"button\" id=\"btn-reset\">Reset Sensor<\u002Fbutton>\n            <button class=\"btn\" type=\"button\" id=\"btn-live\" aria-pressed=\"true\">Live Telemetry (2s)<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:300px 1fr; gap:12px; padding:14px;\">\n          <div>\n            <div class=\"l\" style=\"font-size:12px; font-weight:590; color:var(--sub);\">LPG / Hydrocarbon Concentration<\u002Fdiv>\n            <div class=\"v\" style=\"font-size:30px; font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums; margin-top:2px;\">\n              <span id=\"ppm\">220<\u002Fspan> <span class=\"u\" style=\"font-size:13px; font-weight:590; color:var(--faint);\">ppm<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"n\" style=\"font-size:11px; color:var(--faint);\" id=\"ppm-delta\">▲ +0 ppm<\u002Fdiv>\n            <div class=\"n\" style=\"font-size:11px; color:var(--faint); margin-top:6px;\">Threshold: 1,000 ppm · Baseline: 50–400 ppm<\u002Fdiv>\n            <div style=\"margin-top:10px; height:6px; border-radius:999px; background:rgba(255,255,255,.12); overflow:hidden;\">\n              <div id=\"ppm-bar\" style=\"height:6px; width:11%; background:var(--blue); border-radius:999px;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left:1px solid var(--line); padding-left:12px; min-width:0;\">\n            <div class=\"n\" style=\"font-size:11px; color:var(--faint); margin-bottom:4px;\">Event log<\u002Fdiv>\n            <div id=\"sensor-log\" style=\"max-height:118px; overflow-y:auto;\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"stats\">\n        <div class=\"card stat\"><div class=\"l\">Fatal radiation<\u002Fdiv><div class=\"v\" style=\"color:var(--red)\"><span id=\"s-fatal\">—<\u002Fspan> <span class=\"u\" id=\"u-fatal\">m<\u002Fspan><\u002Fdiv><div class=\"n\">37.5 kW/m² nominal limit<\u002Fdiv><\u002Fdiv>\n        <div class=\"card stat\"><div class=\"l\">Structural collapse<\u002Fdiv><div class=\"v\" style=\"color:var(--dred)\"><span id=\"s-collapse\">—<\u002Fspan> <span class=\"u\" id=\"u-collapse\">m<\u002Fspan><\u002Fdiv><div class=\"n\">3.0 psi severe threshold<\u002Fdiv><\u002Fdiv>\n        <div class=\"card stat\"><div class=\"l\">Total danger footprint<\u002Fdiv><div class=\"v\"><span id=\"s-area\">—<\u002Fspan> <span class=\"u\" id=\"u-area\">km²<\u002Fspan><\u002Fdiv><div class=\"n\">Cumulative ground contour<\u002Fdiv><\u002Fdiv>\n        <div class=\"card stat\"><div class=\"l\">Downwind threat<\u002Fdiv><div class=\"v\"><span id=\"s-plume\">—<\u002Fspan> <span class=\"u\" id=\"u-plume\">m<\u002Fspan><\u002Fdiv><div class=\"n\">Elongated plume tip<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"cols\">\n        <div style=\"display:flex; flex-direction:column; gap:12px;\">\n          <div class=\"card\">\n            <div class=\"ch\">Source &amp; atmospheric deck<\u002Fdiv>\n            <div class=\"cfg\" id=\"cfg\"><\u002Fdiv>\n            <div style=\"padding:10px 14px 14px; display:grid; gap:12px;\" id=\"src\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card\">\n            <div class=\"ch\">Atmospheric &amp; plume dispersion<\u002Fdiv>\n            <div style=\"padding:12px 14px; display:grid; gap:12px;\" id=\"atm\"><\u002Fdiv>\n            <div style=\"padding:0 14px 12px;\" id=\"atmreadout\"><\u002Fdiv>\n            <div style=\"padding:0 14px 14px; display:grid; gap:10px; justify-items:center;\">\n              <div style=\"display:flex; align-items:center; width:100%; gap:8px;\">\n                <span style=\"font-size:12px; color:var(--sub); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">Wind direction (towards)<\u002Fspan>\n                <output id=\"cmp-deg\" style=\"margin-left:auto; font-weight:640; font-variant-numeric:tabular-nums; color:#fff\">—<\u002Foutput>\n                <span id=\"cmp-card\" style=\"font-size:11px; font-weight:640; padding:2px 8px; border-radius:999px; background:rgba(64,200,224,.18); color:var(--teal)\">—<\u002Fspan>\n              <\u002Fdiv>\n              <svg id=\"compass\" width=\"188\" height=\"188\" viewBox=\"0 0 260 260\" role=\"img\" aria-label=\"Wind direction dial\"><\u002Fsvg>\n              <div class=\"seg\" id=\"cmp-pts\" style=\"width:100%; justify-content:space-between\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"card\">\n          <div class=\"ch\">\n            <span id=\"map-title\">Ground contour<\u002Fspan>\n            <div class=\"seg\" style=\"margin-left:auto;\" id=\"seg\">\n              <button type=\"button\" data-view=\"thermal\" aria-pressed=\"true\">Thermal<\u002Fbutton>\n              <button type=\"button\" data-view=\"blast\" aria-pressed=\"false\">Blast<\u002Fbutton>\n              <button type=\"button\" data-view=\"wind\" aria-pressed=\"false\">Wind<\u002Fbutton>\n              <button type=\"button\" data-view=\"all\" aria-pressed=\"false\">All<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div id=\"map\"><\u002Fdiv>\n          <div id=\"map-legend\" style=\"display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;font-weight:560;color:#c2c7cf\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"card\">\n          <div class=\"ch\">Zone classification<\u002Fdiv>\n          <div id=\"zones\"><\u002Fdiv>\n          <div style=\"padding:10px 14px; font-size:11px; color:var(--faint);\">Contours are wind- and terrain-weighted, not circles. Radii quoted at the widest bearing.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\" id=\"compare-card\" style=\"display:none\">\n        <div class=\"ch\">Config comparison <span style=\"font-weight:400;color:var(--faint)\">same model, both scenarios rendered together<\u002Fspan><\u002Fdiv>\n        <div id=\"compare-body\" style=\"padding:0 0 6px\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <div class=\"ch\">Exposure inside the contours <span style=\"font-weight:400;color:var(--faint)\">landmarks visible on the satellite basemap<\u002Fspan><\u002Fdiv>\n        <div id=\"exposure\" style=\"padding:4px 0 0\"><\u002Fdiv>\n        <div style=\"padding:10px 14px; font-size:11px; color:var(--faint);\">Landmark coordinates are hand-placed from the basemap for illustration — not a census or cadastral dataset. No population figures are claimed.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:12px;\">\n        <div class=\"card\">\n          <div class=\"ch\">Thermal radiation decay <span style=\"font-weight:400;color:var(--faint)\">kW/m² vs distance<\u002Fspan><\u002Fdiv>\n          <div style=\"height:210px; padding:12px 14px;\">\n            <svg viewBox=\"0 0 100 100\" preserveAspectRatio=\"none\" style=\"width:100%;height:100%;display:block\">\n              <line x1=\"0\" y1=\"25\" x2=\"100\" y2=\"25\" stroke=\"rgba(255,255,255,.09)\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n              <line x1=\"0\" y1=\"50\" x2=\"100\" y2=\"50\" stroke=\"rgba(255,255,255,.09)\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n              <line x1=\"0\" y1=\"75\" x2=\"100\" y2=\"75\" stroke=\"rgba(255,255,255,.09)\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n              <path id=\"decay-area\" fill=\"rgba(10,132,255,.2)\"><\u002Fpath>\n              <path id=\"decay-line\" fill=\"none\" stroke=\"#0a84ff\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n              <line id=\"mk-fatal\" y1=\"0\" y2=\"100\" stroke=\"#ff453a\" stroke-dasharray=\"4 4\" opacity=\".85\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n              <line id=\"mk-pain\" y1=\"0\" y2=\"100\" stroke=\"#ffd60a\" stroke-dasharray=\"4 4\" opacity=\".85\" vector-effect=\"non-scaling-stroke\"><\u002Fline>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:8px 14px 12px;font-size:11px;color:var(--faint)\">\n            <span>0 m · epicenter<\u002Fspan><span id=\"axis-mid\">—<\u002Fspan><span id=\"axis-max\">—<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <div class=\"ch\">Tactical response protocol<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px; padding:14px;\" id=\"protocol\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"shortcuts\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Keyboard shortcuts\">\n  <div class=\"card\">\n    <div class=\"ch\">\n      <div class=\"seg\" id=\"help-tabs\">\n        <button type=\"button\" data-tab=\"keys\" aria-pressed=\"true\">Shortcuts<\u002Fbutton>\n        <button type=\"button\" data-tab=\"model\" aria-pressed=\"false\">Model assumptions<\u002Fbutton>\n      <\u002Fdiv>\n      <button class=\"btn\" type=\"button\" id=\"help-close\" style=\"margin-left:auto\">Close<\u002Fbutton>\n    <\u002Fdiv>\n    <div id=\"tab-model\" style=\"display:none; padding:14px; font-size:13px; color:#c2c7cf;\">\n      <div class=\"row\"><span>Radiant fraction (χ)<\u002Fspan><span>0.25<\u002Fspan><\u002Fdiv>\n      <div class=\"row\"><span>Burn duration<\u002Fspan><span>600 s<\u002Fspan><\u002Fdiv>\n      <div class=\"row\"><span>TNT reference energy<\u002Fspan><span>4.184 MJ/kg<\u002Fspan><\u002Fdiv>\n      <div class=\"row\"><span>Thermal model<\u002Fspan><span>Point source, API 521<\u002Fspan><\u002Fdiv>\n      <div class=\"row\"><span>Blast model<\u002Fspan><span>Kingery-Bulmash scaled distance Z<\u002Fspan><\u002Fdiv>\n      <div class=\"row\"><span>Z thresholds (3.0 / 1.0 / 0.3 psi)<\u002Fspan><span>5.4 / 9.8 / 24 m·kg⁻⅓<\u002Fspan><\u002Fdiv>\n      <div class=\"row\"><span>Thermal thresholds<\u002Fspan><span>37.5 / 12.5 / 4.0 kW/m²<\u002Fspan><\u002Fdiv>\n      <div class=\"row\" style=\"border:none\"><span>Terrain<\u002Fspan><span>Flat; contour wobble is stylistic, not elevation data<\u002Fspan><\u002Fdiv>\n      <div style=\"margin-top:10px; font-size:12px; color:var(--faint); line-height:1.5;\">\n        Irradiance q = τ·χ·E / (4πr²) with E from fuel mass × burn fraction × heat of combustion over the burn duration.\n        Blast radii from R = Z·W<sup>1/3<\u002Fsup>, W = mass × TNT equivalence × (H<sub>c<\u002Fsub> / 4.184).\n        Contours are stretched along the wind bearing; the stretch is an approximation of plume lean, not a CFD dispersion solution.\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"tab-keys\" style=\"padding:14px; display:grid; gap:8px; font-size:13px; color:#c2c7cf;\">\n      <div style=\"display:flex; gap:10px\"><kbd>1<\u002Fkbd><kbd>2<\u002Fkbd><kbd>3<\u002Fkbd><kbd>4<\u002Fkbd><span>Thermal / Blast / Wind / All overlays<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:10px\"><kbd>C<\u002Fkbd><span>Switch scenario config<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:10px\"><kbd>B<\u002Fkbd><span>Toggle satellite / dark canvas basemap<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:10px\"><kbd>F<\u002Fkbd><span>Fit map to hazard zones<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:10px\"><kbd>U<\u002Fkbd><span>Toggle metres / feet<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:10px\"><kbd>L<\u002Fkbd><span>Simulate leak<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:10px\"><kbd>R<\u002Fkbd><span>Reset sensor<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:10px\"><kbd>Space<\u002Fkbd><span>Pause / resume live telemetry<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex; gap:10px\"><kbd>Esc<\u002Fkbd><span>Close this panel<\u002Fspan><\u002Fdiv>\n      <div style=\"border-top:1px solid var(--line); padding-top:8px; color:var(--faint); font-size:12px;\">\n        Click anywhere on the map to probe irradiance, overpressure and zone membership.\n        Drag the epicenter marker to relocate the source.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div id=\"toast\" role=\"status\"><\u002Fdiv>\n\n<script>\n/* ── scenarios ─────────────────────────────────────────────────────────── */\nconst SCENARIOS = {\n  hpcl: { key:'Config 1', name:'HPCL Visakh', origin:[17.6883, 83.2519], zoom:14,\n          note:'Dense refinery complex — Visakhapatnam petroleum & petrochemical belt',\n          p:{ mass:5.0, hc:45, burn:0.35, tnt:4, wind:4.5, bearing:65, rh:61, tau:0.78 } },\n  lg:   { key:'Config 2', name:'LG Polymers', origin:[17.75528, 83.20889], zoom:14,\n          note:'Isolated styrene storage tank — 2020 incident area, RR Venkatapuram',\n          p:{ mass:1.8, hc:41, burn:0.28, tnt:3, wind:2.6, bearing:200, rh:74, tau:0.71 } },\n};\nconst PARAMS = [\n  { id:'mass',    group:'src', label:'Fuel mass',           min:0.2, max:8,   step:0.1, unit:'M kg',  fmt:v=>v.toFixed(1)+'M kg' },\n  { id:'hc',      group:'src', label:'Heat of combustion',  min:20,  max:55,  step:1,   fmt:v=>v+' MJ/kg' },\n  { id:'burn',    group:'src', label:'Burn fraction',       min:0.05,max:0.8, step:0.01,fmt:v=>v.toFixed(2) },\n  { id:'tnt',     group:'src', label:'TNT equivalence',     min:1,   max:12,  step:0.5, fmt:v=>v+' %' },\n  { id:'wind',    group:'atm', label:'Wind speed',          min:0.5, max:15,  step:0.1, fmt:v=>v.toFixed(1)+' m/s' },\n  { id:'bearing', group:'atm', label:'Wind bearing',        min:0,   max:355, step:5,   fmt:v=>v+'°' },\n  { id:'rh',      group:'atm', label:'Relative humidity',   min:10,  max:95,  step:1,   fmt:v=>v+' %' },\n  { id:'tau',     group:'atm', label:'Transmissivity',      min:0.4, max:1,   step:0.01,fmt:v=>v.toFixed(2) },\n];\n\nconst LANDMARKS = {\n  hpcl: [\n    { name:'Visakhapatnam Airport approach', kind:'Airfield', at:[17.7215, 83.2245] },\n    { name:'NH-16 / Sheela Nagar junction',  kind:'Road junction', at:[17.7015, 83.2380] },\n    { name:'Malkapuram residential blocks',  kind:'Housing', at:[17.6790, 83.2660] },\n    { name:'Refinery marine terminal',       kind:'Port asset', at:[17.6820, 83.2760] },\n    { name:'Scindia rail yard',              kind:'Rail', at:[17.7010, 83.2660] },\n  ],\n  lg: [\n    { name:'Venkatapuram village centre',    kind:'Housing', at:[17.7565, 83.2110] },\n    { name:'Gopalapatnam school cluster',    kind:'School', at:[17.7480, 83.2150] },\n    { name:'NH-16 Gopalapatnam stretch',     kind:'Road junction', at:[17.7430, 83.2050] },\n    { name:'Vepagunta rail crossing',        kind:'Rail', at:[17.7680, 83.1930] },\n    { name:'Kothavalasa branch canal',       kind:'Waterway', at:[17.7620, 83.2260] },\n  ],\n};\n\nlet scenario = 'hpcl';\nlet view = 'thermal';\nlet units = 'm';\nconst FT = 3.28084;\nconst dist_ = v => units === 'm' ? Math.round(v).toLocaleString('en-US') + ' m'\n                                 : Math.round(v * FT).toLocaleString('en-US') + ' ft';\nlet P = { ...SCENARIOS.hpcl.p };\nObject.defineProperty(window, '__P', { get: () => P });\nlet compare = false;\n\n/* ── physics ───────────────────────────────────────────────────────────── */\nconst RADIANT_FRACTION = 0.25, BURN_TIME_S = 600, M_PER_DEG = 111320;\n\nfunction model(Pin) {\n  const P = Pin || window.__P;\n  const massKg = P.mass * 1e6;\n  const energy = massKg * P.burn * P.hc * 1e6;                 // J released\n  const power  = energy * RADIANT_FRACTION / BURN_TIME_S;      // W radiated\n  const rFor = q => Math.sqrt(P.tau * power / (4 * Math.PI * q * 1000)); // q kW/m²\n\n  const wTnt = massKg * (P.tnt / 100) * (P.hc / 4.184);        // kg TNT equivalent (TNT ref 4.184 MJ/kg)\n  const cube = Math.cbrt(wTnt);\n  const rPsi = z => z * cube;                                  // Z (m/kg^1/3) → m\n\n  const plumeStretch = Math.min(1.8, 0.35 + P.wind * 0.16);\n  const zones = [\n    { key:'thermal', name:'Pain cutoff',         threshold:'4.0 kW/m²',  r:rFor(4.0),  color:'#ffd60a', stretch:plumeStretch*0.42, jitter:.05,  seed:1.1 },\n    { key:'thermal', name:'Serious burns',       threshold:'12.5 kW/m²', r:rFor(12.5), color:'#ff9f0a', stretch:plumeStretch*0.36, jitter:.045, seed:2.4 },\n    { key:'thermal', name:'Lethal fire',         threshold:'37.5 kW/m²', r:rFor(37.5), color:'#ff453a', stretch:plumeStretch*0.28, jitter:.035, seed:3.7 },\n    { key:'blast',   name:'Glass breakage',      threshold:'0.3 psi',    r:rPsi(24),   color:'#ffd60a', stretch:.12, jitter:.03,  seed:4.2 },\n    { key:'blast',   name:'Partial failure',     threshold:'1.0 psi',    r:rPsi(9.8),  color:'#ff9f0a', stretch:.10, jitter:.025, seed:5.9 },\n    { key:'blast',   name:'Structural collapse', threshold:'3.0 psi',    r:rPsi(5.4),  color:'#ff453a', stretch:.09, jitter:.025, seed:6.3 },\n  ];\n  const painR = zones[0].r;\n  const plumeTip = painR * (1 + 0.18 * P.wind) * (1 + (100 - P.rh) / 400);\n  zones.push({ key:'wind', name:'Downwind plume', threshold:Math.round(plumeTip)+' m tip',\n               r:plumeTip*0.45, color:'#40c8e0', stretch:plumeStretch, jitter:.06, seed:7.5 });\n  return { zones, painR, plumeTip, fatal:zones[2].r, collapse:zones[5].r, power, wTnt, rFor };\n}\n\n/* wind- and terrain-weighted contour (never a circle) */\nfunction contour(origin, radiusM, stretch, jitter, seed, bearingIn) {\n  const bearing = bearingIn === undefined ? P.bearing : bearingIn;\n  const pts = [];\n  for (let i = 0; i < 96; i++) {\n    const deg = i * 360 / 96;\n    const off = ((deg - bearing) + 540) % 360 - 180;\n    const lobe = 1 + stretch * Math.cos(off * Math.PI / 180) * 0.75\n                   + stretch * 0.4 * Math.pow(Math.cos(off * Math.PI / 360), 6);\n    const n = Math.sin(deg * 0.0873 + seed) * 0.5 + Math.sin(deg * 0.192 + seed * 2.7) * 0.3\n            + Math.sin(deg * 0.041 + seed * 1.3) * 0.2;\n    const r = radiusM * lobe * (1 + jitter * n);\n    const rad = deg * Math.PI / 180;\n    pts.push([\n      origin[0] + (r * Math.cos(rad)) / M_PER_DEG,\n      origin[1] + (r * Math.sin(rad)) / (M_PER_DEG * Math.cos(origin[0] * Math.PI / 180)),\n    ]);\n  }\n  return pts;\n}\nfunction areaKm2(latlngs, origin) {\n  const k = Math.cos(origin[0] * Math.PI / 180) * M_PER_DEG, s = 0;\n  let a = 0;\n  for (let i = 0, n = latlngs.length; i < n; i++) {\n    const [y1, x1] = latlngs[i], [y2, x2] = latlngs[(i + 1) % n];\n    a += ((x1 - origin[1]) * k) * ((y2 - origin[0]) * e', m.collapse * k);\n    animateStat('s-area', areaVal, 2); animateStat('s-plume', m.plumeTip * k);\n  } else {\n    document.getElementById('s-fatal').textContent = fmtM(m.fatal * k);\n    document.getElementById('s-collapse').textContent = fmtM(m.collapse * k);\n    document.getElementById('s-area').textContent = areaVal.toFixed(2);\n    document.getElementById('s-plume').textContent = fmtM(m.plumeTip * k);\n  }\n\n  document.getElementById('atmreadout').innerHTML =\n    `<div class=\"row\"><span>Origin coords<\u002Fspan><span>${o[0].toFixed(4)}°N, ${o[1].toFixed(4)}°E<\u002Fspan><\u002Fdiv>\n     <div class=\"row\"><span>Wind vector<\u002Fspan><span>${P.wind.toFixed(1)} m/s · ${P.bearing}°<\u002Fspan><\u002Fdiv>\n     <div class=\"row\" style=\"border:none\"><span>TNT equivalent<\u002Fspan><span>${(m.wTnt / 1000).toFixed(0)} t<\u002Fspan><\u002Fdiv>`;\n\n  document.getElementById('zones').innerHTML = m.zones.filter(z => z.key !== 'wind').map(z => `\n    <div class=\"zone\" data-zoom=\"${z.r}\" title=\"Click to fit this contour\">\n      <div style=\"display:flex;align-items:center;gap:8px\">\n        <span class=\"sw\" style=\"background:${z.color}\"><\u002Fspan>\n        <span style=\"font-size:13px;font-weight:620\">${z.name}<\u002Fspan>\n        <span style=\"margin-left:auto;font-size:13px;font-weight:640\">${dist_(z.r)}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:11px;color:var(--faint);padding-left:17px\">${z.threshold}<\u002Fdiv>\n    <\u002Fdiv>`).join('');\n\n  document.getElementById('map-legend').innerHTML = visible.map(z =>\n    `<span style=\"display:inline-flex;align-items:center;gap:6px;white-space:nowrap\"><span class=\"sw\" style=\"background:${z.color}\"><\u002Fspan>${z.name}<\u002Fspan>`).join('');\n\n  document.getElementById('protocol').innerHTML = [\n    ['1','Initial isolation perimeter', `Evacuate all personnel within the ${dist_(m.fatal)} lethal-fire contour.`],\n    ['2','Downwind evacuation corridor', `Clear downwind sectors up to ${dist_(m.plumeTip)} along bearing ${String(P.bearing).padStart(3,'0')}°.`],\n    ['3','PPE standards', 'Full turnout gear and positive-pressure SCBA inside the pain-threshold envelope.'],\n  ].map(([n,t,b]) => `\n    <div style=\"display:flex;gap:10px;align-items:flex-start\">\n      <span style=\"flex:none;width:22px;height:22px;border-radius:999px;background:rgba(255,69,58,.2);color:#ff8078;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center\">${n}<\u002Fspan>\n      <div style=\"min-width:0\"><div style=\"font-size:13px;font-weight:620\">${t}<\u002Fdiv>\n      <div style=\"font-size:13px;color:#b9bec6;line-height:1.4\">${b}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>`).join('');\n\n  const maxR = Math.max(m.painR * 1.7, 60), maxQ = 60;\n  let dPath = '';\n  for (let i = 0; i <= 60; i++) {\n    const r = Math.max(8, (i / 60) * maxR);\n    const q = P.tau * m.power / (4 * Math.PI * r * r) / 1000;\n    dPath += (i ? 'L' : 'M') + ((i / 60) * 100).toFixed(1) + ' ' + (100 - Math.min(100, (q / maxQ) * 100)).toFixed(1) + ' ';\n  }\n  document.getElementById('decay-line').setAttribute('d', dPath);\n  document.getElementById('decay-area').setAttribute('d', dPath + 'L100 100 L0 100 Z');\n  const xf = (m.fatal / maxR) * 100, xp = (m.painR / maxR) * 100;\n  document.getElementById('mk-fatal').setAttribute('x1', xf); document.getElementById('mk-fatal').setAttribute('x2', xf);\n  document.getElementById('mk-pain').setAttribute('x1', xp);  document.getElementById('mk-pain').setAttribute('x2', xp);\n  document.getElementById('axis-mid').textContent = dist_(maxR / 2);\n  document.getElementById('axis-max').textContent = dist_(maxR);\n}\n/* ── quality-of-life helpers ──────────────────────────────────────────── */\nlet toastTimer;\nfunction toast(msg) {\n  const t = document.getElementById('toast');\n  t.textContent = msg; t.classList.add('on');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);\n}\n\nfunction syncUrl() {\n  const o = SCENARIOS[scenario].origin;\n  const q = new URLSearchParams({ s:scenario, v:view, b:base, u:units,\n    lat:o[0].toFixed(5), lng:o[1].toFixed(5),\n    ...Object.fromEntries(Object.entries(P).map(([k, v]) => [k, String(v)])) });\n  history.replaceState(null, '', '#' + q.toString());\n}\nfunction restoreUrl() {\n  if (!location.hash.length) return false;\n  const q = new URLSearchParams(location.hash.slice(1));\n  if (q.get('s') && SCENARIOS[q.get('s')]) scenario = q.get('s');\n  P = { ...SCENARIOS[scenario].p };\n  PARAMS.forEach(p => { const v = parseFloat(q.get(p.id)); if (isFinite(v)) P[p.id] = Math.min(p.max, Math.max(p.min, v)); });\n  const lat = parseFloat(q.get('lat')), lng = parseFloat(q.get('lng'));\n  if (isFinite(lat) && isFinite(lng)) SCENARIOS[scenario].origin = [lat, lng];\n  if (q.get('v')) view = q.get('v');\n  if (q.get('u') === 'ft') units = 'ft';\n  if (q.get('b') === 'street') base = 'street';\n  return true;\n}\n\nfunction setUnits(u) {\n  units = u;\n  document.querySelectorAll('[data-unit]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.unit === u)));\n  render(); syncUrl();\n}\nfunction fitZones() {\n  const o = SCENARIOS[scenario].origin, m = model();\n  const outer = Math.max(...m.zones.map(z => z.r)) * 1.35;\n  map.fitBounds(L.latLngBounds(\n    [o[0] - outer / M_PER_DEG, o[1] - outer / (M_PER_DEG * Math.cos(o[0] * Math.PI / 180))],\n    [o[0] + outer / M_PER_DEG, o[1] + outer / (M_PER_DEG * Math.cos(o[0] * Math.PI / 180))]));\n}\n\ndocument.getElementById('units').addEventListener('click', e => {\n  if (e.target.dataset.unit) setUnits(e.target.dataset.unit);\n});\ndocument.getElementById('fit').addEventListener('click', fitZones);\ndocument.getElementById('copylink').addEventListener('click', async () => {\n  syncUrl();\n  try { await navigator.clipboard.writeText(location.href); toast('Shareable link copied — parameters included'); }\n  catch { toast('Link is in the address bar'); }\n});\nconst dlg = document.getElementById('shortcuts');\nconst openHelp = () => { dlg.style.display = 'flex'; };\nconst closeHelp = () => { dlg.style.display = 'none'; };\n['help', 'help2'].forEach(id => document.getElementById(id).addEventListener('click', openHelp));\ndocument.getElementById('help-close').addEventListener('click', closeHelp);\ndlg.addEventListener('click', e => { if (e.target === dlg) closeHelp(); });\n\ndocument.addEventListener('keydown', e => {\n  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;\n  const k = e.key.toLowerCase();\n  if (k === 'escape') return closeHelp();\n  if (k === '?' || k === '/') { e.preventDefault(); return openHelp(); }\n  if (k === '1') return setView('thermal');\n  if (k === '2') return setView('blast');\n  if (k === '3') return setView('wind');\n  if (k === '4') return setView('all');\n  if (k === 'c') return setScenario(scenario === 'hpcl' ? 'lg' : 'hpcl');\n  if (k === 'b') return setBase(base === 'sat' ? 'street' : 'sat');\n  if (k === 'f') return fitZones();\n  if (k === 'u') return setUnits(units === 'm' ? 'ft' : 'm');\n  if (k === 'x') return setCompare(!compare);\n  if (k === 'l') return simulateLeak();\n  if (k === 'r') return resetSensor();\n  if (k === ' ') { e.preventDefault(); return setLive(!live); }\n});\n\n/* ── config comparison ────────────────────────────────────────────────── */\nlet comparePolys = [];\nfunction setCompare(on) {\n  compare = on;\n  document.querySelectorAll('#compare, #si-compare').forEach(b => b.setAttribute('aria-pressed', String(on)));\n  document.getElementById('compare-card').style.display = on ? 'block' : 'none';\n  render();\n  if (on) { fitBoth(); toast('Both configs drawn — dashed contours are the inactive config'); }\n}\nfunction fitBoth() {\n  const pad = [];\n  Object.keys(SCENARIOS).forEach(id => {\n    const o = SCENARIOS[id].origin, m = model(SCENARIOS[id].p);\n    const r = Math.max(...m.zones.map(z => z.r)) * 1.3;\n    const dLat = r / M_PER_DEG, dLng = r / (M_PER_DEG * Math.cos(o[0] * Math.PI / 180));\n    pad.push([o[0] - dLat, o[1] - dLng], [o[0] + dLat, o[1] + dLng]);\n  });\n  map.fitBounds(L.latLngBounds(pad));\n}\nfunction drawCompare() {\n  comparePolys.forEach(p => map.removeLayer(p));\n  comparePolys = [];\n  if (!compare) return;\n  Object.keys(SCENARIOS).forEach(id => {\n    if (id === scenario) return;\n    const s = SCENARIOS[id], m = model(s.p);\n    m.zones.filter(z => z.key !== 'wind').forEach(z => {\n      const poly = L.polygon(contour(s.origin, z.r, z.stretch, z.jitter, z.seed, s.p.bearing), {\n        color: z.color, weight: 2, opacity: .8, dashArray: '5 6', fill: false,\n      }).bindTooltip(s.name + ' · ' + z.name + ' · ' + dist_(z.r), { sticky: true });\n      poly.addTo(map); comparePolys.push(poly);\n    });\n    const pin = L.circleMarker(s.origin, { radius: 4, color: '#fff', weight: 2, fillColor: '#0b0d10', fillOpacity: 1, dashArray: '2 2' })\n      .bindTooltip(s.name + ' epicenter', { direction: 'top' });\n    pin.addTo(map); comparePolys.push(pin);\n  });\n}\nfunction paintCompare() {\n  if (!compare) return;\n  const ids = Object.keys(SCENARIOS);\n  const models = ids.map(id => ({ id, s: SCENARIOS[id], m: model(id === scenario ? P : SCENARIOS[id].p),\n                                  p: id === scenario ? P : SCENARIOS[id].p }));\n  const rows = [\n    ['Fuel mass',            d => d.p.mass.toFixed(1) + 'M kg'],\n    ['Burn fraction',        d => d.p.burn.toFixed(2)],\n    ['TNT equivalence',      d => d.p.tnt + ' %'],\n    ['Wind',                 d => d.p.wind.toFixed(1) + ' m/s · ' + d.p.bearing + '°'],\n    ['Lethal fire radius',   d => dist_(d.m.fatal)],\n    ['Structural collapse',  d => dist_(d.m.collapse)],\n    ['Downwind plume tip',   d => dist_(d.m.plumeTip)],\n    ['TNT equivalent mass',  d => (d.m.wTnt / 1000).toFixed(0) + ' t'],\n  ];\n  const head = models.map(d => '<span style=\"font-weight:640;color:#fff\">' + d.s.key + ' · ' + d.s.name +\n    (d.id === scenario ? ' <span style=\"color:var(--blue)\">(active)<\u002Fspan>' : '') + '<\u002Fspan>').join('');\n  document.getElementById('compare-body').innerHTML =\n    '<div style=\"display:grid;grid-template-columns:190px 1fr 1fr;gap:0 14px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub)\">' +\n      '<span>Parameter<\u002Fspan>' + head + '<\u002Fdiv>' +\n    rows.map(([label, fn]) =>\n      '<div style=\"display:grid;grid-template-columns:190px 1fr 1fr;gap:0 14px;padding:7px 14px;border-bottom:1px solid var(--line);font-size:13px\">' +\n      '<span style=\"color:var(--sub)\">' + label + '<\u002Fspan>' +\n      models.map(d => '<span style=\"font-weight:600;font-variant-numeric:tabular-nums\">' + fn(d) + '<\u002Fspan>').join('') +\n      '<\u002Fdiv>').join('') +\n    '<div style=\"padding:10px 14px;font-size:12px;color:var(--faint);line-height:1.5\">' +\n      models[0].s.name + ' carries roughly ' + (models[0].p.mass / models[1].p.mass).toFixed(1) +\n      '× the fuel mass of ' + models[1].s.name + ' at a higher burn fraction, so its thermal radii scale with the square root of released power — the difference in lethal radius is ' +\n      dist_(Math.abs(models[0].m.fatal - models[1].m.fatal)) + '. Wind bearing (' +\n      models[0].p.bearing + '° vs ' + models[1].p.bearing + '°) sends the plumes in opposite directions.' +\n    '<\u002Fdiv>';\n}\n['compare', 'si-compare'].forEach(id => document.getElementById(id).addEventListener('click', () => setCompare(!compare)));\n\n/* ── exposure callout ─────────────────────────────────────────────────── */\nfunction paintExposure() {\n  const o = SCENARIOS[scenario].origin, m = model();\n  const list = (LANDMARKS[scenario] || []).map(L0 => {\n    const dLat = (L0.at[0] - o[0]) * M_PER_DEG;\n    const dLng = (L0.at[1] - o[1]) * M_PER_DEG * Math.cos(o[0] * Math.PI / 180);\n    const d = Math.hypot(dLat, dLng);\n    const brg = (Math.atan2(dLng, dLat) * 180 / Math.PI + 360) % 360;\n    const off = ((brg - P.bearing) + 540) % 360 - 180;\n    const hit = m.zones.filter(z => z.key !== 'wind').filter(z => {\n      const lobe = 1 + z.stretch * Math.cos(off * Math.PI / 180) * 0.75\n                     + z.stretch * 0.4 * Math.pow(Math.cos(off * Math.PI / 360), 6);\n      return d <= z.r * lobe;\n    });\n    const worst = hit.length ? hit[hit.length - 1] : null;\n    return { ...L0, d, brg, worst, downwind: Math.abs(off) < 60 };\n  }).sort((a, b) => a.d - b.d);\n\n  const inside = list.filter(x => x.worst);\n  document.getElementById('exposure').innerHTML =\n    '<div style=\"padding:6px 14px 10px;font-size:13px;color:#c2c7cf;line-height:1.5\">' +\n      (inside.length\n        ? 'At the current settings the contours reach <b style=\"color:#fff\">' + inside.length + '<\u002Fb> of ' + list.length +\n          ' mapped landmarks — including ' + inside.slice(0, 2).map(x => '<b style=\"color:#fff\">' + x.name + '<\u002Fb>').join(' and ') +\n          '. The nearest is ' + dist_(list[0].d) + ' from the epicenter.'\n        : 'No mapped landmark currently falls inside a hazard contour — the nearest, ' +\n          '<b style=\"color:#fff\">' + list[0].name + '<\u002Fb>, sits ' + dist_(list[0].d) + ' out.') +\n    '<\u002Fdiv>' +\n    list.map(x =>\n      '<div class=\"zone\" style=\"display:grid;grid-template-columns:1fr 130px 150px 110px;gap:10px;align-items:center\">' +\n      '<span style=\"font-size:13px;font-weight:600\">' + x.name + '<\u002Fspan>' +\n      '<span style=\"font-size:12px;color:var(--faint)\">' + x.kind + '<\u002Fspan>' +\n      '<span style=\"font-size:12px;font-variant-numeric:tabular-nums\">' + dist_(x.d) + ' · ' + Math.round(x.brg) + '°' +\n        (x.downwind ? ' <span style=\"color:#40c8e0\">downwind<\u002Fspan>' : '') + '<\u002Fspan>' +\n      (x.worst\n        ? '<span style=\"font-size:11px;font-weight:640;padding:2px 8px;border-radius:999px;background:' + x.worst.color + '22;color:' + x.worst.color + '\">' + x.worst.name + '<\u002Fspan>'\n        : '<span style=\"font-size:11px;color:var(--faint)\">Outside contours<\u002Fspan>') +\n      '<\u002Fdiv>').join('');\n}\n\n/* ── help dialog tabs ─────────────────────────────────────────────────── */\ndocument.getElementById('help-tabs').addEventListener('click', e => {\n  const t = e.target.dataset.tab;\n  if (!t) return;\n  document.querySelectorAll('#help-tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === t)));\n  document.getElementById('tab-keys').style.display = t === 'keys' ? 'grid' : 'none';\n  document.getElementById('tab-model').style.display = t === 'model' ? 'block' : 'none';\n});\n\n/* ── simulated gas sensor ─────────────────────────────────────────────── */\nconst LEAK_THRESHOLD = 1000;\nlet sensorPpm = 220, prevPpm = 220, leakActive = false, live = true, forceTicks = 0;\nconst stamp = () => new Date().toISOString().slice(11, 19) + 'Z';\n\nfunction logEvent(text, ppm) {\n  const el = document.getElementById('sensor-log');\n  const row = document.createElement('div');\n  row.className = 'zone';\n  row.style.padding = '7px 4px';\n  row.innerHTML = '<div style=\"display:flex;align-items:center;gap:8px\">' +\n    '<span style=\"font-size:12px;font-weight:620;font-variant-numeric:tabular-nums\">' + stamp() + '<\u002Fspan>' +\n    '<span style=\"margin-left:auto;font-size:12px;font-weight:640;font-variant-numeric:tabular-nums\">' + Math.round(ppm) + ' ppm<\u002Fspan><\u002Fdiv>' +\n    '<div style=\"font-size:11px;color:var(--faint)\">' + text + '<\u002Fdiv>';\n  el.prepend(row);\n  while (el.children.length > 40) el.lastElementChild.remove();\n}\n\nfunction paintSensor() {\n  const d = sensorPpm - prevPpm;\n  document.getElementById('ppm').textContent = Math.round(sensorPpm).toLocaleString('en-US');\n  document.getElementById('ppm-delta').textContent =\n    (d >= 0 ? '▲ +' : '▼ ') + Math.round(d).toLocaleString('en-US') + ' ppm';\n  const pct = Math.min(100, (sensorPpm / 2000) * 100);\n  const bar = document.getElementById('ppm-bar');\n  bar.style.width = pct + '%';\n  bar.style.background = sensorPpm >= LEAK_THRESHOLD ? 'var(--red)' : sensorPpm > 450 ? 'var(--orange)' : 'var(--blue)';\n  const pill = document.getElementById('sensor-pill');\n  if (sensorPpm >= LEAK_THRESHOLD) { pill.textContent = 'Leak'; pill.style.background = 'rgba(255,69,58,.2)'; pill.style.color = '#ff8078'; }\n  else if (sensorPpm > 450)        { pill.textContent = 'Elevated'; pill.style.background = 'rgba(255,159,10,.2)'; pill.style.color = '#ffbe5c'; }\n  else                             { pill.textContent = 'Nominal'; pill.style.background = 'rgba(48,209,88,.18)'; pill.style.color = '#5be07f'; }\n}\n\nfunction tick() {\n  prevPpm = sensorPpm;\n  if (forceTicks > 0) {\n    forceTicks--;\n    sensorPpm = Math.min(1900, sensorPpm + 420 + Math.random() * 260);\n  } else {\n    const delta = (Math.random() * 2 - 1) * 200;\n    sensorPpm = Math.max(0, sensorPpm + delta);\n    sensorPpm = leakActive ? Math.min(sensorPpm, 2000) : Math.min(sensorPpm, 450);\n  }\n  const crossed = prevPpm < LEAK_THRESHOLD && sensorPpm >= LEAK_THRESHOLD;\n  if (sensorPpm >= LEAK_THRESHOLD) leakActive = true;\n  if (crossed) {\n    document.getElementById('leak-banner').style.display = 'block';\n    document.getElementById('leak-time').textContent = stamp();\n    logEvent('Leak threshold crossed — hazard zone confirmed', sensorPpm);\n    render();\n    if (window.gsap) gsap.fromTo('#leak-banner', { opacity: 0, y: -8 }, { opacity: 1, y: 0, duration: .4, clearProps: 'all' });\n  }\n  paintSensor();\n}\n\nlet sensorTimer = setInterval(tick, 2000);\nfunction setLive(on) {\n  live = on;\n  clearInterval(sensorTimer);\n  if (on) sensorTimer = setInterval(tick, 2000);\n  document.querySelectorAll('#btn-live, #si-live').forEach(b => b.setAttribute('aria-pressed', String(on)));\n}\nfunction simulateLeak() {\n  forceTicks = 3;\n  tick();\n  /* finish the climb even when live telemetry is paused */\n  const climb = setInterval(() => { if (forceTicks > 0) tick(); else clearInterval(climb); }, 600);\n}\nfunction resetSensor() {\n  forceTicks = 0; leakActive = false; prevPpm = sensorPpm; sensorPpm = 220;\n  document.getElementById('leak-banner').style.display = 'none';\n  logEvent('Sensor reset — returned to baseline', 220);\n  paintSensor();\n}\n['btn-leak', 'si-leak'].forEach(id => document.getElementById(id).addEventListener('click', simulateLeak));\n['btn-reset', 'si-reset'].forEach(id => document.getElementById(id).addEventListener('click', resetSensor));\n['btn-live', 'si-live'].forEach(id => document.getElementById(id).addEventListener('click', () => setLive(!live)));\nlogEvent('Telemetry online — sensor array VZ-14 nominal', 220);\npaintSensor();\n\n/* boot: restore shared state, then first paint */\nif (restoreUrl()) {\n  epicenter.setLatLng(SCENARIOS[scenario].origin);\n  map.setView(SCENARIOS[scenario].origin, SCENARIOS[scenario].zoom);\n  if (base === 'street') { base = 'sat'; setBase('street'); }\n  document.querySelectorAll('[data-scenario]').forEach(el => {\n    const on = String(el.dataset.scenario === scenario);\n    el.hasAttribute('aria-current') ? el.setAttribute('aria-current', on) : el.setAttribute('aria-pressed', on);\n  });\n  document.querySelectorAll('[data-view]').forEach(el => el.setAttribute('aria-pressed', String(el.dataset.view === view)));\n  document.querySelectorAll('[data-unit]').forEach(el => el.setAttribute('aria-pressed', String(el.dataset.unit === units)));\n}\nrender();\n\n/* ── click-to-probe any coordinate on the map ─────────────────────────── */\nmap.on('click', e => {\n  const o = SCENARIOS[scenario].origin, m = model();\n  const dLat = (e.latlng.lat - o[0]) * M_PER_DEG;\n  const dLng = (e.latlng.lng - o[1]) * M_PER_DEG * Math.cos(o[0] * Math.PI / 180);\n  const dist = Math.hypot(dLat, dLng);\n  let brg = (Math.atan2(dLng, dLat) * 180 / Math.PI + 360) % 360;\n  const off = ((brg - P.bearing) + 540) % 360 - 180;\n  const q = P.tau * m.power / (4 * Math.PI * Math.max(dist, 5) ** 2) / 1000;\n  const psiOf = r => { const z = r / Math.cbrt(m.wTnt); return z < 5.4 ? '>3.0' : z < 9.8 ? '~1.0–3.0' : z < 24 ? '~0.3–1.0' : '<0.3'; };\n  const inZone = m.zones\n    .filter(z => z.key !== 'wind')\n    .filter(z => {\n      const lobe = 1 + z.stretch * Math.cos(off * Math.PI / 180) * 0.75\n                     + z.stretch * 0.4 * Math.pow(Math.cos(off * Math.PI / 360), 6);\n      return dist <= z.r * lobe;\n    })\n    .map(z => z.name);\n  const worst = inZone.length ? inZone[inZone.length - 1] : 'Outside all contours';\n  const downwind = Math.abs(off) < 60 ? 'downwind' : Math.abs(off) > 120 ? 'upwind' : 'crosswind';\n  L.popup({ className: 'probe' })\n    .setLatLng(e.latlng)\n    .setContent(\n      '<div style=\"font:13px -apple-system,system-ui;color:#e8eaee;min-width:214px\">' +\n      '<div style=\"font-weight:700;margin-bottom:4px\">' + worst + '<\u002Fdiv>' +\n      '<div style=\"display:grid;gap:2px;font-size:12px;color:#b9bec6\">' +\n      '<div>' + e.latlng.lat.toFixed(5) + '°N, ' + e.latlng.lng.toFixed(5) + '°E<\u002Fdiv>' +\n      '<div>' + dist_(dist) + ' from epicenter · bearing ' + Math.round(brg) + '°<\u002Fdiv>' +\n      '<div>Irradiance ' + q.toFixed(1) + ' kW/m² · overpressure ' + psiOf(dist) + ' psi<\u002Fdiv>' +\n      '<div>Position: ' + downwind + ' of plume axis (' + P.bearing + '°)<\u002Fdiv>' +\n      (inZone.length ? '<div style=\"color:#ff8078\">Zones: ' + inZone.join(', ') + '<\u002Fdiv>' : '') +\n      '<\u002Fdiv><\u002Fdiv>')\n    .openOn(map);\n});\n\n/* ── GSAP motion ───────────────────────────────────────────────────────── */\nconst G = window.gsap;\nif (G) {\n  G.defaults({ ease: 'power3.out' });\n\n  /* entrance: window, then panels staggered */\n  G.from('.win', { duration: .7, y: 18, opacity: 0, clearProps: 'all' });\n  G.from('.stats .card', { duration: .55, y: 14, opacity: 0, stagger: .07, delay: .15, clearProps: 'all' });\n  G.from('.cols > *, .cols .card', { duration: .6, y: 16, opacity: 0, stagger: .06, delay: .25, clearProps: 'all' });\n  G.from('.side .si', { duration: .4, x: -10, opacity: 0, stagger: .03, delay: .3, clearProps: 'all' });\n\n  /* stat cards: tween the numbers instead of snapping */\n  const counters = {};\n  window.animateStat = (id, to, decimals) => {\n    const el = document.getElementById(id);\n    if (!el) return;\n    const from = counters[id] ?? 0;\n    counters[id] = to;\n    const o = { v: from };\n    G.to(o, { v: to, duration: .6, onUpdate: () => {\n      el.textContent = decimals ? o.v.toFixed(decimals) : Math.round(o.v).toLocaleString('en-US');\n    }});\n  };\n\n  /* contour reveal: scale each polygon out from the epicenter on change */\n  window.revealPolys = (list) => {\n    list.forEach((poly, i) => {\n      const path = poly.getElement && poly.getElement();\n      if (!path) return;\n      G.fromTo(path,\n        { opacity: 0, transformOrigin: 'center center', scale: .82 },\n        { opacity: 1, scale: 1, duration: .55, delay: i * .05, ease: 'power2.out', clearProps: 'transform,opacity' });\n    });\n  };\n\n  /* pulse the epicenter ring continuously */\n  const ep = epicenter.getElement && epicenter.getElement();\n  if (ep) G.to(ep, { scale: 1.25, opacity: .6, duration: 1.1, repeat: -1, yoyo: true, ease: 'sine.inOut', transformOrigin: 'center center' });\n\n  /* micro-interaction on scenario / overlay buttons */\n  document.querySelectorAll('.cfg button, .seg button, .btn').forEach(b => {\n    b.addEventListener('pointerdown', () => G.to(b, { scale: .96, duration: .1 }));\n    b.addEventListener('pointerup',   () => G.to(b, { scale: 1, duration: .25, ease: 'back.out(3)' }));\n    b.addEventListener('pointerleave',() => G.to(b, { scale: 1, duration: .2 }));\n  });\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
